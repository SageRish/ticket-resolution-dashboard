<style>
/* ============================================================
   Breathe Villa Resolution Report
   Palette: cool slate neutrals, blue bias. Accent = validated
   categorical slot 1. Green/red are STATUS roles only and always
   ship with a glyph + word, never colour alone.
   ============================================================ */
:root{
  color-scheme: light;
  --ground:#f4f7fb;
  --panel:#ffffff;
  --panel-2:#fafcff;
  --sunk:#eef3fa;
  --line:#dbe4f0;
  --line-soft:#e9eff7;
  --ink:#0e1726;
  --ink-2:#41546e;
  --ink-3:#6b7e97;
  --accent:#2a78d6;
  --accent-ink:#1c5cab;
  --accent-wash:#e8f1fd;
  --series-2:#eb6834;
  --good:#0ca30c;
  --good-wash:#e6f6e6;
  --bad:#d03b3b;
  --bad-wash:#fbeaea;
  --neutral-mark:#93a5bd;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 8px 24px -12px rgba(14,23,38,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0d1219;
    --panel:#141b25;
    --panel-2:#111823;
    --sunk:#1a232f;
    --line:#26313f;
    --line-soft:#1e2734;
    --ink:#e9eff8;
    --ink-2:#a8b8cd;
    --ink-3:#7e90a8;
    --accent:#3987e5;
    --accent-ink:#7cb2f2;
    --accent-wash:#16273c;
    --series-2:#d95926;
    --good:#3cbb3c;
    --good-wash:#142a16;
    --bad:#e35f5f;
    --bad-wash:#2e1618;
    --neutral-mark:#5b6d86;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0d1219;
  --panel:#141b25;
  --panel-2:#111823;
  --sunk:#1a232f;
  --line:#26313f;
  --line-soft:#1e2734;
  --ink:#e9eff8;
  --ink-2:#a8b8cd;
  --ink-3:#7e90a8;
  --accent:#3987e5;
  --accent-ink:#7cb2f2;
  --accent-wash:#16273c;
  --series-2:#d95926;
  --good:#3cbb3c;
  --good-wash:#142a16;
  --bad:#e35f5f;
  --bad-wash:#2e1618;
  --neutral-mark:#5b6d86;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num{font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.mast{
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:40;
}
.mast-in{
  max-width:1180px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:17px;font-weight:600;letter-spacing:-.01em;
}
.brand span{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}

/* ---------- villa search ---------- */
.lookup{position:relative;min-width:270px}
.lookup label{
  display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px;font-weight:500;
}
.lookup-field{display:flex;align-items:center;gap:8px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);
  padding:0 10px;transition:border-color .15s,box-shadow .15s}
.lookup-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.lookup-field svg{flex:none;color:var(--ink-3)}
#villaInput{
  border:0;background:none;outline:none;color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;
  padding:9px 0;width:100%;
}
#villaInput::placeholder{color:var(--ink-3);font-family:"IBM Plex Sans",sans-serif}
.sugg{
  position:absolute;top:100%;left:0;right:0;margin-top:6px;z-index:60;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);max-height:290px;overflow-y:auto;display:none;padding:4px;
}
.sugg.on{display:block}
.sugg button{
  display:flex;width:100%;align-items:baseline;gap:10px;
  background:none;border:0;border-radius:6px;cursor:pointer;
  padding:7px 10px;text-align:left;color:var(--ink);font:inherit;
}
.sugg button:hover,.sugg button.cur{background:var(--accent-wash);color:var(--accent-ink)}
.sugg .sv{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500}
.sugg .sm{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.sugg .none{padding:12px;color:var(--ink-3);font-size:13px}

/* ---------- shell ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-h{
  display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding:16px 20px;border-bottom:1px solid var(--line-soft);
}
.panel-h h2{
  font-family:"IBM Plex Serif",Georgia,serif;font-size:16px;letter-spacing:-.005em;
}
.panel-h p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3);max-width:62ch}
.panel-b{padding:20px}

/* ---------- identity band ---------- */
.ident{
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  padding:18px 22px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
}
.ident-name{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.ident-name .vn{
  font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;letter-spacing:-.02em;
}
.ident-name .vs{font-size:12.5px;color:var(--ink-3)}
.minis{display:flex;gap:26px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;gap:2px}
.mini b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600}
.mini span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- escalation cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
}
.card-top{padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;flex:1}
.card-tag{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.urgent{background:var(--bad)}
.dot.usual{background:var(--accent)}
.card-tag b{font-size:14px;font-weight:600}
.card-tag code{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  background:var(--sunk);border:1px solid var(--line-soft);border-radius:5px;padding:1.5px 6px;
}
.hero{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hero .v{
  font-family:"IBM Plex Mono",monospace;font-size:40px;font-weight:600;
  letter-spacing:-.03em;line-height:1;
}
.hero .u{font-size:13px;color:var(--ink-3)}
.card-sub{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.card-sub b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.empty{
  font-size:13px;color:var(--ink-3);background:var(--sunk);border:1px dashed var(--line);
  border-radius:8px;padding:12px 14px;line-height:1.45;
}

/* ---------- comparison bars ---------- */
.cmp{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.cmp-row{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:11px;font-size:12px}
.cmp-row .lbl{color:var(--ink-2);text-align:right}
.track{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fill.me{background:var(--accent)}
.fill.soc{background:var(--neutral-mark)}
.cmp-row .val{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;text-align:right}

/* ---------- status chip: colour + glyph + word ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  border-radius:999px;padding:4px 11px 4px 9px;font-size:12px;font-weight:600;
  border:1px solid transparent;
}
.chip.good{background:var(--good-wash);color:var(--good);border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.chip.bad{background:var(--bad-wash);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.chip.flat{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.chip .g{font-size:11px;line-height:1}

/* ---------- formula disclosure ---------- */
.fx-bar{border-top:1px solid var(--line-soft);background:var(--panel-2);display:flex}
.fx-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:0;cursor:pointer;color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:11px 20px;text-align:left;
}
.fx-btn:hover{color:var(--accent-ink);background:var(--accent-wash)}
.fx-btn .fx{
  font-family:"IBM Plex Serif",Georgia,serif;font-style:italic;font-weight:600;
  color:var(--accent);font-size:14px;
}
.fx-btn .car{margin-left:auto;transition:transform .2s;font-size:10px;color:var(--ink-3)}
.fx-btn[aria-expanded="true"] .car{transform:rotate(90deg)}
.fx-body{display:none;padding:0 20px 18px;background:var(--panel-2);border-top:1px solid var(--line-soft)}
.fx-body.on{display:block}
.fx-note{font-size:12px;color:var(--ink-2);margin:14px 0 10px;line-height:1.55}
.fx-note code{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--sunk);
  border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;color:var(--ink);
}
.formula{position:relative;margin-bottom:12px}
.formula-lab{
  display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px;
}
.formula-lab .cell{
  font-family:"IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;
  background:var(--accent-wash);color:var(--accent-ink);border-radius:4px;padding:1px 6px;font-size:11px;
}
.formula pre{
  margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  padding:11px 46px 11px 13px;overflow-x:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;line-height:1.65;
  color:var(--ink);white-space:pre;
}
.copy{
  position:absolute;top:25px;right:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;color:var(--ink-2);cursor:pointer;font:inherit;font-size:11px;
  padding:4px 8px;transition:color .15s,border-color .15s;
}
.copy:hover{color:var(--accent-ink);border-color:var(--accent)}
.copy.done{color:var(--good);border-color:var(--good)}

/* ---------- charts ---------- */
.chart-wrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.axis-l{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;fill:var(--ink-3)}
.grid-l{stroke:var(--line-soft);stroke-width:1}
.bar-lab{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink-2);font-weight:500}
.mark-lab{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;fill:var(--accent-ink)}

/* ---------- segmented control ---------- */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  background:none;border:0;border-radius:6px;cursor:pointer;color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:5px 13px;transition:background .15s,color .15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent-ink);font-weight:600;box-shadow:var(--shadow)}

/* ---------- trend chart ---------- */
.trend{position:relative}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);padding:9px 11px;font-size:12px;min-width:150px;z-index:5;
}
.tip.on{opacity:1}
.tip b{display:block;font-size:12px;margin-bottom:5px;color:var(--ink)}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--ink-2);line-height:1.65}
.tip .r i{width:9px;height:9px;border-radius:2px;flex:none}
.tip .r span{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.tip .prov{margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft);color:var(--bad);font-size:11px;line-height:1.45}
.caption{font-size:12px;color:var(--ink-3);margin:12px 0 0;line-height:1.6;max-width:78ch}
.caption b{color:var(--ink-2)}

/* ---------- tables ---------- */
.tbl-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbl-tools input{
  border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);
  padding:7px 11px;font:inherit;font-size:13px;outline:none;min-width:200px;
}
.tbl-tools input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.tbl-note{font-size:12px;color:var(--ink-3);margin-left:auto}
.tbl-scroll{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{
  position:sticky;top:0;z-index:2;background:var(--sunk);text-align:left;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--accent-ink)}
th .ar{opacity:.35;margin-left:3px;font-size:9px}
th.on .ar{opacity:1;color:var(--accent)}
td{padding:8px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
tr.me td{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
tr.me:hover td{background:var(--accent-wash)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
tr.me td.n{color:var(--accent-ink)}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;border:1px solid transparent}
.pill.urgent{background:var(--bad-wash);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.pill.usual{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.pill.open{background:var(--accent-wash);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}

/* ---------- methodology ---------- */
.meth{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.meth section{display:flex;flex-direction:column;gap:6px}
.meth h3{font-size:12.5px;color:var(--ink)}
.meth p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.meth code{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--sunk);
  border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;
}
.drop{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.drop li{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  background:var(--sunk);border:1px solid var(--line-soft);border-radius:5px;padding:2px 7px;
  text-decoration:line-through;
}
footer{max-width:1180px;margin:0 auto;padding:0 24px 40px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.blank{text-align:center;padding:60px 20px;color:var(--ink-3)}
.blank b{display:block;font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;color:var(--ink);margin-bottom:8px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:640px){
  .mast-in{padding:12px 16px}
  main{padding:20px 16px 60px}
  .lookup{min-width:100%;order:3}
  .hero .v{font-size:34px}
  .ident-name .vn{font-size:23px}
}
</style>

<script>
/* =====================================================================
   Breathe Villa Resolution Report
   Every figure on this page is reproducible against the original export.
   The Excel formulas rendered under each metric reference the RAW sheet
   (header on row 3, data in rows 4:1180), not this dashboard's own data.
   ===================================================================== */
(function () {
  "use strict";

  var DATA = window.TICKET_DATA;
  var META = DATA.meta;
  var TICKETS = DATA.tickets;

  /* --- geometry of the source workbook, used to build every formula --- */
  var XL = {
    first: 4,
    last: 3 + TICKETS.length,
    col: { created: "B", category: "D", flat: "G", status: "J", closed: "L", esc: "N", rtat: "R" },
    mins: "W",       // helper column the reader adds
    bucket: "X",     // helper column: month / week key for the trend chart
    cutoff: "Z$1",   // cell holding the open-ticket cutoff
    uniq: "AA",      // unique villa list
    avg: "AB"        // per-villa average
  };
  XL.uniqLast = 3 + META.flats;

  var ESC = { "Level-1": "Urgent", "NA": "Usual" };
  var ESC_KEYS = ["Level-1", "NA"];

  /* ========================= formatting ========================= */
  function dhm(m) {
    if (m == null || isNaN(m)) return "—";
    m = Math.round(m);
    var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
    if (d > 0) return d + "d " + h + "h";
    if (h > 0) return h + "h " + mi + "m";
    return mi + "m";
  }
  function days(m) { return m == null ? "—" : (m / 1440).toFixed(1); }
  function n0(x) { return Math.round(x).toLocaleString("en-US"); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function dt(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  function num(x) { return +x.replace(/\D/g, "") || 0; }
  /* Category values carry stray whitespace in the export ("Gardening "). Excel
     criteria must use the raw value, so only the label is trimmed. */
  function catLabel(c) { return c.trim(); }
  function hasPadding(c) { return c !== c.trim(); }

  /* ========================= aggregation ========================= */
  function stats(list) {
    if (!list.length) return { n: 0, mean: null, median: null, min: null, max: null };
    var v = list.map(function (t) { return t.mins; }).sort(function (a, b) { return a - b; });
    var sum = v.reduce(function (a, b) { return a + b; }, 0);
    var mid = Math.floor(v.length / 2);
    return {
      n: v.length,
      mean: sum / v.length,
      median: v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2,
      min: v[0], max: v[v.length - 1]
    };
  }

  var FLATS = Array.from(new Set(TICKETS.map(function (t) { return t.flat; })))
    .sort(function (a, b) { return num(a) - num(b); });
  var CATEGORIES = Array.from(new Set(TICKETS.map(function (t) { return t.category; }))).sort();

  var VILLA = {};
  FLATS.forEach(function (f) { VILLA[f] = { flat: f, tickets: [], open: 0, byCat: {} }; });
  TICKETS.forEach(function (t) {
    var v = VILLA[t.flat];
    v.tickets.push(t);
    if (t.open) v.open++;
  });
  FLATS.forEach(function (f) {
    var v = VILLA[f];
    v.all = stats(v.tickets);
    ESC_KEYS.forEach(function (k) {
      v[k] = stats(v.tickets.filter(function (t) { return t.esc === k; }));
    });
    CATEGORIES.forEach(function (c) {
      var s = stats(v.tickets.filter(function (t) { return t.category === c; }));
      if (s.n) v.byCat[c] = s;
    });
    v.tickets.sort(function (a, b) { return a.created < b.created ? 1 : -1; });
  });

  var SOC = { all: stats(TICKETS), byCat: {} };
  ESC_KEYS.forEach(function (k) {
    SOC[k] = stats(TICKETS.filter(function (t) { return t.esc === k; }));
  });
  CATEGORIES.forEach(function (c) {
    SOC.byCat[c] = stats(TICKETS.filter(function (t) { return t.category === c; }));
  });

  /* Ranking uses the MEDIAN. The mean is 3.6x the median society-wide and is
     set by a handful of very old tickets, so a mean ranking mostly sorts
     villas by whether they had one unlucky ticket. See "Why median". */
  var RANKED = FLATS.slice().sort(function (a, b) { return VILLA[a].all.median - VILLA[b].all.median; });
  /* Excel's RANK gives tied values the SAME rank, so mirror that here -- the
     rank badge must agree with the RANK formula published beside it. */
  RANKED.forEach(function (f, i) {
    VILLA[f].rank = (i > 0 && VILLA[RANKED[i - 1]].all.median === VILLA[f].all.median)
      ? VILLA[RANKED[i - 1]].rank
      : i + 1;
  });
  var MEDIAN_VILLA = RANKED[Math.floor(RANKED.length / 2)];
  var FASTEST = RANKED[0], SLOWEST = RANKED[RANKED.length - 1];

  function standing(f) {
    var me = VILLA[f].all.median, longer = 0, shorter = 0, same = 0;
    FLATS.forEach(function (o) {
      if (o === f) return;
      var m = VILLA[o].all.median;
      if (m > me) longer++; else if (m < me) shorter++; else same++;
    });
    return {
      longer: longer, shorter: shorter, same: same,
      rank: VILLA[f].rank, total: FLATS.length,
      pctSlower: FLATS.length > 1 ? (longer / (FLATS.length - 1)) * 100 : 0
    };
  }

  /* ==================== Excel formula builders ==================== */
  function R(c) { return "$" + c + "$" + XL.first + ":$" + c + "$" + XL.last; }
  var MR = R(XL.mins);
  var AVGR = "$" + XL.avg + "$" + XL.first + ":$" + XL.avg + "$" + XL.uniqLast;
  var C = XL.col, N1 = XL.first;
  /* Column B is text ("20-08-26, 08:56 AM"); this turns it into a real date. */
  var DATE_B = "DATE(2000+VALUE(MID($" + C.created + N1 + ",7,2)),VALUE(MID($" +
    C.created + N1 + ",4,2)),VALUE(LEFT($" + C.created + N1 + ",2)))";

  var F = {
    cutoff: "=DATE(2026,8,20)+TIME(9,30,0)",

    minutes:
      '=IF($' + C.closed + N1 + '="-",\n' +
      '  ROUND(($' + XL.cutoff + '-(DATE(2000+VALUE(MID($' + C.created + N1 + ',7,2)),VALUE(MID($' +
      C.created + N1 + ',4,2)),VALUE(LEFT($' + C.created + N1 + ',2)))+TIMEVALUE(MID($' +
      C.created + N1 + ',11,8))))*1440,0),\n' +
      '  VALUE(LEFT($' + C.rtat + N1 + ',FIND(" ",$' + C.rtat + N1 + ')-1))*1440\n' +
      '   +VALUE(MID($' + C.rtat + N1 + ',FIND("): ",$' + C.rtat + N1 + ')+3,FIND(" hour",$' +
      C.rtat + N1 + ')-FIND("): ",$' + C.rtat + N1 + ')-3))*60\n' +
      '   +VALUE(MID($' + C.rtat + N1 + ',FIND("hour(s): ",$' + C.rtat + N1 + ')+9,FIND(" minute",$' +
      C.rtat + N1 + ')-FIND("hour(s): ",$' + C.rtat + N1 + ')-9)))',

    villaEsc: function (f, k) {
      return "=AVERAGEIFS(" + MR + "," + R(C.flat) + ',"' + f + '",' + R(C.esc) + ',"' + k + '")';
    },
    villaEscCount: function (f, k) {
      return "=COUNTIFS(" + R(C.flat) + ',"' + f + '",' + R(C.esc) + ',"' + k + '")';
    },
    villaEscMedian: function (f, k) {
      return "=MEDIAN(IF((" + R(C.flat) + '="' + f + '")*(' + R(C.esc) + '="' + k + '"),' + MR + "))";
    },
    socEsc: function (k) { return "=AVERAGEIFS(" + MR + "," + R(C.esc) + ',"' + k + '")'; },
    socEscMedian: function (k) {
      return "=MEDIAN(IF(" + R(C.esc) + '="' + k + '",' + MR + "))";
    },
    villaAll: function (f) { return "=AVERAGEIFS(" + MR + "," + R(C.flat) + ',"' + f + '")'; },
    /* Excel has no MEDIANIFS, so every median is MEDIAN(IF(...)) -- an array
       formula (Ctrl+Shift+Enter before Excel 365, plain Enter in 365). */
    villaMedian: function (f) {
      return "=MEDIAN(IF(" + R(C.flat) + '="' + f + '",' + MR + "))";
    },
    socAll: "=AVERAGE(" + MR + ")",
    socMedian: "=MEDIAN(" + MR + ")",
    uniqList: "=UNIQUE(" + R(C.flat) + ")",
    perVilla: "=AVERAGEIFS(" + MR + "," + R(C.flat) + ",$" + XL.uniq + N1 + ")",
    perVillaMedian: "=MEDIAN(IF(" + R(C.flat) + "=$" + XL.uniq + N1 + "," + MR + "))",
    longer: function (f) {
      return "=COUNTIF(" + AVGR + ',">"&MEDIAN(IF(' + R(C.flat) + '="' + f + '",' + MR + ")))";
    },
    shorter: function (f) {
      return "=COUNTIF(" + AVGR + ',"<"&MEDIAN(IF(' + R(C.flat) + '="' + f + '",' + MR + ")))";
    },
    rank: function (f) {
      return "=RANK(MEDIAN(IF(" + R(C.flat) + '="' + f + '",' + MR + "))," + AVGR + ",1)";
    },
    cat: function (f, c) {
      return "=AVERAGEIFS(" + MR + "," + R(C.flat) + ',"' + f + '",' + R(C.category) + ',"' + c + '")';
    },
    catMedian: function (f, c) {
      return "=MEDIAN(IF((" + R(C.flat) + '="' + f + '")*(' + R(C.category) + '="' + c + '"),' + MR + "))";
    },
    socCat: function (c) { return "=AVERAGEIFS(" + MR + "," + R(C.category) + ',"' + c + '")'; },
    socCatMedian: function (c) {
      return "=MEDIAN(IF(" + R(C.category) + '="' + c + '",' + MR + "))";
    },
    count: function (f) { return "=COUNTIF(" + R(C.flat) + ',"' + f + '")'; },
    openCount: function (f) {
      return "=COUNTIFS(" + R(C.flat) + ',"' + f + '",' + R(C.closed) + ',"-")';
    },
    display: "=INT(" + XL.mins + N1 + '/1440)&"d "&INT(MOD(' + XL.mins + N1 + ',1440)/60)&"h"',

    /* --- trend buckets --- */
    monthKey: "=TEXT(" + DATE_B + ',"yyyy-mm")',
    weekKey: "=TEXT(" + DATE_B + "-WEEKDAY(" + DATE_B + ',3),"yyyy-mm-dd")',
    bucketAvg: function (k) {
      return "=AVERAGEIFS(" + MR + "," + R(XL.bucket) + ',"' + k + '")';
    },
    bucketMedian: function (k) {
      return "=MEDIAN(IF(" + R(XL.bucket) + '="' + k + '",' + MR + "))";
    },
    bucketCount: function (k) { return "=COUNTIF(" + R(XL.bucket) + ',"' + k + '")'; },
    bucketOpen: function (k) {
      return "=COUNTIFS(" + R(XL.bucket) + ',"' + k + '",' + R(C.closed) + ',"-")';
    }
  };

  /* ==================== view helpers ==================== */
  var OPEN_FX = {};   // persists which formula drawers are open across re-render

  function formula(label, cell, code) {
    return '<div class="formula">' +
      '<div class="formula-lab">' + esc(label) +
      (cell ? '<span class="cell">' + esc(cell) + "</span>" : "") + "</div>" +
      "<pre>" + esc(code) + "</pre>" +
      '<button class="copy" type="button" data-copy="' + esc(code) + '">Copy</button>' +
      "</div>";
  }

  function fx(id, note, blocks) {
    var on = !!OPEN_FX[id];
    return '<div class="fx-bar">' +
      '<button class="fx-btn" type="button" data-fx="' + id + '" aria-expanded="' + on + '" aria-controls="' + id + '">' +
      '<span class="fx">fx</span><span>Show the Excel formula</span><span class="car">▶</span>' +
      "</button></div>" +
      '<div class="fx-body' + (on ? " on" : "") + '" id="' + id + '">' +
      (note ? '<p class="fx-note">' + note + "</p>" : "") + blocks + "</div>";
  }

  function chip(mine, base) {
    if (mine == null || base == null || !base) return "";
    var d = ((mine - base) / base) * 100;
    var r = Math.round(Math.abs(d));
    if (r < 1) return '<span class="chip flat"><span class="g">=</span>Same as society average</span>';
    var slower = d > 0;
    return '<span class="chip ' + (slower ? "bad" : "good") + '">' +
      '<span class="g">' + (slower ? "▲" : "▼") + "</span>" +
      r + "% " + (slower ? "slower" : "faster") + " than society</span>";
  }

  function bars(rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.v || 0; })) || 1;
    return '<div class="cmp">' + rows.map(function (r) {
      return '<div class="cmp-row"><span class="lbl">' + esc(r.label) + "</span>" +
        '<span class="track"><span class="fill ' + r.cls + '" style="width:' +
        (r.v == null ? 0 : Math.max(1.5, (r.v / max) * 100)) + '%"></span></span>' +
        '<span class="val">' + dhm(r.v) + "</span></div>";
    }).join("") + "</div>";
  }

  /* ==================== state ==================== */
  var S = {
    flat: null,
    peer: null,
    sortKey: "rank",
    sortDir: 1,
    q: "",
    grain: "month"
  };

  /* ==================== sections ==================== */

  function secIdentity(f) {
    var v = VILLA[f];
    var first = v.tickets[v.tickets.length - 1], last = v.tickets[0];
    return '<div class="ident">' +
      '<div class="ident-name"><span class="vn">' + esc(f) + "</span>" +
      '<span class="vs">' + esc(META.society) + " · tickets from " + dt(first.created) + " to " + dt(last.created) + "</span></div>" +
      '<div class="minis">' +
      '<div class="mini"><b>' + v.all.n + "</b><span>Tickets</span></div>" +
      '<div class="mini"><b>' + (v.all.n - v.open) + "</b><span>Closed</span></div>" +
      '<div class="mini"><b>' + v.open + "</b><span>Still open</span></div>" +
      '<div class="mini"><b>' + dhm(v.all.median) + "</b><span>Typical ticket</span></div>" +
      '<div class="mini"><b>#' + v.rank + "</b><span>of " + FLATS.length + " villas</span></div>" +
      "</div></div>";
  }

  function escCard(f, k) {
    var v = VILLA[f], s = v[k], soc = SOC[k], label = ESC[k];
    var id = "fx-esc-" + k.replace(/\W/g, "");
    var body;

    if (!s.n) {
      body = '<div class="empty"><b>No ' + label.toLowerCase() + " tickets for " + esc(f) + ".</b><br>" +
        "Across the whole society there " + (soc.n === 1 ? "is " : "are ") + soc.n + " " +
        label.toLowerCase() + " ticket" + (soc.n === 1 ? "" : "s") +
        ", with a typical one taking <b>" + dhm(soc.median) + "</b>.</div>";
    } else {
      body =
        '<div class="hero"><span class="v">' + days(s.median) + '</span><span class="u">days for a typical ticket · ' +
        dhm(s.median) + "</span></div>" +
        chip(s.median, soc.median) +
        '<div class="card-sub"><span>Average <b>' + dhm(s.mean) + "</b></span>" +
        "<span>Fastest <b>" + dhm(s.min) + "</b></span>" +
        "<span>Slowest <b>" + dhm(s.max) + "</b></span>" +
        "<span>Tickets <b>" + s.n + "</b></span></div>" +
        bars([
          { label: esc(f), v: s.median, cls: "me" },
          { label: "Society", v: soc.median, cls: "soc" }
        ]);
    }

    return '<div class="card"><div class="card-top">' +
      '<div class="card-tag"><span class="dot ' + (k === "Level-1" ? "urgent" : "usual") + '"></span>' +
      "<b>" + label + "</b><code>Escalation Level = " + esc(k) + "</code></div>" +
      body + "</div>" +
      fx(id + "-" + f,
        "Add the <code>" + XL.mins + "</code> helper column first (see <b>How every number is built</b> at the foot of the page), then:",
        formula("Median — the headline figure (array formula: Ctrl+Shift+Enter before Excel 365)",
          null, F.villaEscMedian(f, k)) +
        formula("Society median, for the comparison bar", null, F.socEscMedian(k)) +
        formula("Average, shown underneath", null, F.villaEsc(f, k)) +
        formula("Ticket count", null, F.villaEscCount(f, k))) +
      "</div>";
  }

  function secEscalation(f) {
    return '<div class="panel"><div class="panel-h"><div>' +
      '<h2>Resolution time by escalation level</h2>' +
      "<p>The headline figure is the <b>median</b> &mdash; what a typical ticket from " + esc(f) +
      " actually takes. The average sits underneath it, and " +
      '<a href="#why-median" style="color:var(--accent-ink)">why that order matters</a> is explained below. ' +
      "Lower is better.</p></div></div>" +
      '<div class="panel-b"><div class="cards">' +
      ESC_KEYS.map(function (k) { return escCard(f, k); }).join("") +
      "</div></div></div>";
  }

  /* ---- distribution of all villa averages, with this villa marked ---- */
  function histogram(f) {
    var W = 900, H = 210, PL = 44, PR = 16, PT = 14, PB = 34;
    var BIN = 1, MAXD = 14;                       // 1-day bins to 14d, then overflow
    var nb = MAXD / BIN + 1;
    var binsArr = new Array(nb).fill(0);
    var mineBin = 0;
    FLATS.forEach(function (o) {
      var d = VILLA[o].all.median / 1440;
      var i = d >= MAXD ? nb - 1 : Math.floor(d / BIN);
      binsArr[i]++;
      if (o === f) mineBin = i;
    });
    var maxC = Math.max.apply(null, binsArr);
    var iw = (W - PL - PR) / nb, ih = H - PT - PB;

    var g = "";
    for (var t = 0; t <= 2; t++) {
      var y = PT + ih - (ih * t) / 2, val = Math.round((maxC * t) / 2);
      g += '<line class="grid-l" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>' +
        '<text class="axis-l" x="' + (PL - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + val + "</text>";
    }

    var b = binsArr.map(function (c, i) {
      var h = maxC ? (c / maxC) * ih : 0;
      var x = PL + i * iw + 2, y = PT + ih - h;
      var mine = i === mineBin;
      return '<rect x="' + x + '" y="' + y + '" width="' + (iw - 4) + '" height="' + Math.max(h, c ? 2 : 0) +
        '" rx="3" fill="' + (mine ? "var(--accent)" : "var(--neutral-mark)") +
        '" opacity="' + (mine ? 1 : 0.55) + '"><title>' +
        (i === nb - 1 ? MAXD + "+ days" : i * BIN + "–" + (i + 1) * BIN + " days") +
        ": " + c + " villa" + (c === 1 ? "" : "s") + "</title></rect>";
    }).join("");

    var ax = "";
    for (var i = 0; i < nb; i += 2) {
      ax += '<text class="axis-l" x="' + (PL + i * iw + iw / 2) + '" y="' + (H - PB + 16) +
        '" text-anchor="middle">' + (i === nb - 1 ? MAXD + "+" : i * BIN) + "</text>";
    }
    ax += '<text class="axis-l" x="' + (PL + (W - PL - PR) / 2) + '" y="' + (H - 3) +
      '" text-anchor="middle">Median resolution time (days)</text>';

    var mx = PL + mineBin * iw + iw / 2;
    var mark = '<line x1="' + mx + '" y1="' + (PT - 6) + '" x2="' + mx + '" y2="' + (PT + ih) +
      '" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>' +
      '<text class="mark-lab" x="' + (mx + (mineBin > nb - 4 ? -7 : 7)) + '" y="' + (PT - 1) +
      '" text-anchor="' + (mineBin > nb - 4 ? "end" : "start") + '">' + esc(f) + "</text>";

    return '<div class="legend"><span><i style="background:var(--accent)"></i>' + esc(f) + " (your villa)</span>" +
      '<span><i style="background:var(--neutral-mark);opacity:.55"></i>Other villas</span></div>' +
      '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Distribution of median resolution time across all villas">' +
      g + b + mark + ax + "</svg></div>";
  }

  function secStanding(f) {
    var st = standing(f), v = VILLA[f];
    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>How " + esc(f) + " compares with every other villa</h2>" +
      "<p>All " + FLATS.length + " villas ranked by their <b>median</b> resolution time across every ticket they raised.</p>" +
      "</div></div>" +
      '<div class="panel-b">' +
      '<div class="cards" style="margin-bottom:22px">' +
      '<div class="card"><div class="card-top">' +
      '<div class="card-tag"><span class="dot usual"></span><b>Villas slower than yours</b></div>' +
      '<div class="hero"><span class="v">' + st.longer + '</span><span class="u">of ' + (st.total - 1) +
      " other villas take longer</span></div>" +
      '<div class="card-sub"><span>That puts you ahead of <b>' + Math.round(st.pctSlower) + "%</b> of villas</span></div>" +
      "</div></div>" +
      '<div class="card"><div class="card-top">' +
      '<div class="card-tag"><span class="dot urgent"></span><b>Villas faster than yours</b></div>' +
      '<div class="hero"><span class="v">' + st.shorter + '</span><span class="u">of ' + (st.total - 1) +
      " other villas resolve quicker</span></div>" +
      '<div class="card-sub"><span>Overall rank <b>#' + st.rank + "</b> of " + st.total +
      " · typical ticket <b>" + dhm(v.all.median) + "</b> · average <b>" + dhm(v.all.mean) +
      "</b></span></div>" +
      "</div></div>" +
      "</div>" +
      histogram(f) +
      "</div>" +
      fx("fx-standing-" + f,
        "First build a per-villa median table: put <code>" + F.uniqList + "</code> in <code>" + XL.uniq + XL.first +
        "</code> to list every villa, then array-enter <code>" + esc(F.perVillaMedian) + "</code> in <code>" +
        XL.avg + XL.first + "</code> and fill down to row " + XL.uniqLast +
        ". (Excel has no MEDIANIFS, so medians use MEDIAN(IF(...)) &mdash; Ctrl+Shift+Enter before Excel 365.) Then:",
        formula("Per-villa median — fill down", XL.avg + XL.first, F.perVillaMedian) +
        formula("Villas that take LONGER than " + f, null, F.longer(f)) +
        formula("Villas that are FASTER than " + f, null, F.shorter(f)) +
        formula("Rank of " + f + " (1 = fastest)", null, F.rank(f)) +
        formula("This villa's own median", null, F.villaMedian(f))) +
      "</div>";
  }

  /* ---- head to head against any other villa ---- */
  function secHeadToHead(f) {
    var peer = S.peer && S.peer !== f ? S.peer : (RANKED[0] === f ? RANKED[1] : RANKED[0]);
    var a = VILLA[f], b = VILLA[peer];

    function row(label, av, bv, lower) {
      var better = av == null || bv == null ? "" :
        (av === bv ? "" : (av < bv) === !!lower ? "a" : "b");
      return "<tr><td>" + esc(label) + "</td>" +
        '<td class="n"' + (better === "a" ? ' style="color:var(--good);font-weight:600"' : "") + ">" +
        (typeof av === "number" && av > 100 ? dhm(av) : av == null ? "—" : av) + "</td>" +
        '<td class="n"' + (better === "b" ? ' style="color:var(--good);font-weight:600"' : "") + ">" +
        (typeof bv === "number" && bv > 100 ? dhm(bv) : bv == null ? "—" : bv) + "</td></tr>";
    }

    var opts = FLATS.filter(function (x) { return x !== f; }).map(function (x) {
      return '<option value="' + esc(x) + '"' + (x === peer ? " selected" : "") + ">" +
        esc(x) + " — " + dhm(VILLA[x].all.median) + " typical</option>";
    }).join("");

    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>Head to head</h2>" +
      "<p>Compare " + esc(f) + " directly against any other villa in the society.</p></div>" +
      '<div style="margin-left:auto"><label class="eyebrow" for="peerSel" style="display:block;margin-bottom:4px">Compare with</label>' +
      '<select id="peerSel" style="border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2);' +
      'color:var(--ink);padding:7px 10px;font:inherit;font-size:13px;font-family:\'IBM Plex Mono\',monospace">' +
      opts + "</select></div></div>" +
      '<div class="panel-b"><div class="tbl-scroll" style="max-height:none"><table>' +
      "<thead><tr><th>Measure</th><th>" + esc(f) + "</th><th>" + esc(peer) + "</th></tr></thead><tbody>" +
      row("Typical ticket (median)", a.all.median, b.all.median, true) +
      row("Average resolution", a.all.mean, b.all.mean, true) +
      row("Urgent median", a["Level-1"].median, b["Level-1"].median, true) +
      row("Usual median", a["NA"].median, b["NA"].median, true) +
      row("Fastest ticket", a.all.min, b.all.min, true) +
      row("Slowest ticket", a.all.max, b.all.max, true) +
      row("Tickets raised", a.all.n, b.all.n, false) +
      row("Still open", a.open, b.open, true) +
      row("Rank (1 = fastest)", a.rank, b.rank, true) +
      "</tbody></table></div></div>" +
      fx("fx-h2h-" + f + "-" + peer,
        "Swap the villa name in the criteria to compare any two villas.",
        formula("Median for " + f, null, F.villaMedian(f)) +
        formula("Median for " + peer, null, F.villaMedian(peer)) +
        formula("Average for " + f, null, F.villaAll(f)) +
        formula("Urgent median for " + f, null, F.villaEscMedian(f, "Level-1")) +
        formula("Tickets raised by " + f, null, F.count(f)) +
        formula("Still-open tickets for " + f, null, F.openCount(f))) +
      "</div>";
  }

  /* ---- category breakdown, villa vs society ---- */
  function secCategories(f) {
    var v = VILLA[f];
    var cats = Object.keys(v.byCat).sort(function (a, b) { return v.byCat[b].median - v.byCat[a].median; });
    if (!cats.length) return "";

    var rows = cats.map(function (c) {
      var mine = v.byCat[c], soc = SOC.byCat[c];
      return '<div style="margin-bottom:16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px;flex-wrap:wrap">' +
        '<b style="font-size:13px">' + esc(catLabel(c)) + '</b>' +
        '<span style="font-size:11.5px;color:var(--ink-3)">' + mine.n + " ticket" + (mine.n === 1 ? "" : "s") +
        " · " + esc(f) + " <b class=\"num\" style=\"color:var(--ink)\">" + dhm(mine.median) +
        "</b> vs society <b class=\"num\" style=\"color:var(--ink)\">" + dhm(soc.median) + "</b></span></div>" +
        bars([
          { label: esc(f), v: mine.median, cls: "me" },
          { label: "Society", v: soc.median, cls: "soc" }
        ]).replace('class="cmp"', 'class="cmp" style="gap:5px"') +
        "</div>";
    }).join("");

    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>Which kinds of problems take longest</h2>" +
      "<p>" + esc(f) + "&rsquo;s median resolution time per category, against the society median for the same category.</p>" +
      "</div></div><div class=\"panel-b\">" + rows + "</div>" +
      fx("fx-cat-" + f,
        "One pair of formulas per category. " + (cats.some(hasPadding)
          ? "Note that <b>" + cats.filter(hasPadding).map(function (c) { return esc(catLabel(c)); }).join(", ") +
            "</b> is stored in the sheet with a trailing space, so the criteria below keep it &mdash; " +
            "retyping the name without it makes Excel match nothing."
          : "The criteria match the category text exactly as the sheet stores it."),
        cats.map(function (c) {
          return formula(catLabel(c) + " — " + f + " (median)", null, F.catMedian(f, c)) +
            formula(catLabel(c) + " — society (median)", null, F.socCatMedian(c));
        }).join("")) +
      "</div>";
  }

  /* ---- society-wide resolution trend over the whole period ---- */

  /* A bucket is "provisional" once this share of its tickets are still open:
     those are aged only to the cutoff, so the bucket understates reality. */
  var PROVISIONAL_AT = 0.10;

  /* Round a raw axis step up to 1/2/2.5/5/10 x a power of ten, so tick labels
     read 0d 5d 10d rather than 0d 3.75d 7.5d. */
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var pick = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return pick * mag;
  }

  function monthKey(iso) { return iso.slice(0, 7); }
  function weekKey(iso) {
    var d = new Date(iso.slice(0, 10) + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // back to Monday
    return d.toISOString().slice(0, 10);
  }
  function monthLabel(k) {
    return new Date(k + "-01T00:00:00").toLocaleDateString("en-GB", { month: "short", year: "2-digit" });
  }
  function weekLabel(k) {
    return new Date(k + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function trendSeries(grain) {
    var keyOf = grain === "week" ? weekKey : monthKey;
    var buckets = {};
    TICKETS.forEach(function (t) {
      var k = keyOf(t.created);
      (buckets[k] || (buckets[k] = { key: k, mins: [], open: 0 }));
      buckets[k].mins.push(t.mins);
      if (t.open) buckets[k].open++;
    });
    return Object.keys(buckets).sort().map(function (k) {
      var b = buckets[k], s = stats(b.mins.map(function (m) { return { mins: m }; }));
      return {
        key: k,
        label: grain === "week" ? weekLabel(k) : monthLabel(k),
        n: b.mins.length,
        open: b.open,
        mean: s.mean,
        median: s.median,
        provisional: b.open / b.mins.length >= PROVISIONAL_AT
      };
    });
  }

  function trendChart(pts) {
    var W = 900, PL = 54, PR = 20, PT = 16;
    var IH = 168, GAP = 30, VH = 52, PB = 30;
    var H = PT + IH + GAP + VH + PB;
    var n = pts.length, iw = (W - PL - PR) / n;
    var xAt = function (i) { return PL + iw * (i + 0.5); };

    var maxD = Math.max.apply(null, pts.map(function (p) { return Math.max(p.mean, p.median) / 1440; }));
    var step = niceStep(maxD / 4);
    var top = Math.max(Math.ceil(maxD / step) * step, step);
    var ticks = Math.round(top / step);
    var yAt = function (d) { return PT + IH - (d / top) * IH; };
    var maxN = Math.max.apply(null, pts.map(function (p) { return p.n; }));
    var vy = PT + IH + GAP;

    var svg = "";

    /* shaded band behind provisional buckets */
    var firstProv = pts.findIndex(function (p) { return p.provisional; });
    if (firstProv >= 0) {
      var bx = xAt(firstProv) - iw / 2;
      svg += '<rect x="' + bx + '" y="' + PT + '" width="' + (W - PR - bx) + '" height="' + (IH + GAP + VH) +
        '" fill="var(--bad)" opacity="0.05"/>' +
        '<line x1="' + bx + '" y1="' + PT + '" x2="' + bx + '" y2="' + (vy + VH) +
        '" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>';
    }

    /* y grid + labels */
    for (var g = 0; g <= ticks; g++) {
      var d = step * g, y = yAt(d);
      svg += '<line class="grid-l" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>' +
        '<text class="axis-l" x="' + (PL - 9) + '" y="' + (y + 3.5) + '" text-anchor="end">' +
        (Math.round(d * 10) / 10) + "d</text>";
    }

    /* volume bars (own plot area, shared x -- never a second y-axis on the line chart) */
    pts.forEach(function (p, i) {
      var h = maxN ? (p.n / maxN) * VH : 0;
      svg += '<rect x="' + (xAt(i) - iw / 2 + 3) + '" y="' + (vy + VH - h) + '" width="' + (iw - 6) +
        '" height="' + Math.max(h, 1) + '" rx="2.5" fill="var(--neutral-mark)" opacity="' +
        (p.provisional ? 0.35 : 0.6) + '"/>';
    });
    svg += '<line class="grid-l" x1="' + PL + '" y1="' + (vy + VH) + '" x2="' + (W - PR) + '" y2="' + (vy + VH) + '"/>' +
      '<text class="axis-l" x="' + (PL - 9) + '" y="' + (vy + 10) + '" text-anchor="end">' + maxN + "</text>" +
      '<text class="axis-l" x="' + (PL - 9) + '" y="' + (vy + VH) + '" text-anchor="end">0</text>' +
      '<text class="axis-l" x="' + PL + '" y="' + (vy - 9) + '">Tickets raised</text>';

    /* the two lines: solid through settled buckets, dashed once provisional */
    [
      { k: "median", c: "var(--accent)", name: "Median" },
      { k: "mean", c: "var(--series-2)", name: "Average" }
    ].forEach(function (s) {
      var solid = [], dashed = [];
      pts.forEach(function (p, i) {
        var pt = [xAt(i), yAt(p[s.k] / 1440)];
        if (p.provisional) {
          if (!dashed.length && i > 0) dashed.push([xAt(i - 1), yAt(pts[i - 1][s.k] / 1440)]);
          dashed.push(pt);
        } else solid.push(pt);
      });
      var d2 = function (a) { return a.map(function (q, i) { return (i ? "L" : "M") + q[0] + " " + q[1]; }).join(" "); };
      if (solid.length > 1) svg += '<path d="' + d2(solid) + '" fill="none" stroke="' + s.c + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      if (dashed.length > 1) svg += '<path d="' + d2(dashed) + '" fill="none" stroke="' + s.c + '" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>';
      pts.forEach(function (p, i) {
        svg += '<circle cx="' + xAt(i) + '" cy="' + yAt(p[s.k] / 1440) + '" r="4" fill="' +
          (p.provisional ? "var(--panel)" : s.c) + '" stroke="' + s.c + '" stroke-width="2"/>';
      });
      /* direct label on the final point */
      var last = pts[pts.length - 1];
      svg += '<text class="bar-lab" x="' + (xAt(n - 1) + 9) + '" y="' + (yAt(last[s.k] / 1440) + 4) +
        '" fill="' + s.c + '" text-anchor="end" opacity="0">' + s.name + "</text>";
    });

    /* x labels, thinned so they never collide */
    var step = Math.ceil(n / 12);
    pts.forEach(function (p, i) {
      if (i % step && i !== n - 1) return;
      svg += '<text class="axis-l" x="' + xAt(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(p.label) + "</text>";
    });

    /* hover bands */
    pts.forEach(function (p, i) {
      svg += '<rect data-band="' + i + '" x="' + (xAt(i) - iw / 2) + '" y="' + PT + '" width="' + iw +
        '" height="' + (IH + GAP + VH) + '" fill="transparent" style="cursor:crosshair"/>';
    });

    return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Average and median resolution time for the whole society over time">' +
      svg + "</svg></div>";
  }

  function secTrend() {
    var grain = S.grain;
    var pts = trendSeries(grain);
    var first = pts[0], last = pts[pts.length - 1];
    var settled = pts.filter(function (p) { return !p.provisional; });
    var lastSettled = settled[settled.length - 1];
    var provCount = pts.length - settled.length;

    var change = first.median && lastSettled
      ? ((lastSettled.median - first.median) / first.median) * 100 : null;

    var dir = change == null ? "" : change < 0 ? "faster" : "slower";

    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>Resolution time across the whole period</h2>" +
      "<p>Every ticket in the society, grouped by when it was raised. The gap between the two lines " +
      "is the skew: the average runs well above the median because a few very old tickets drag it up.</p></div>" +
      '<div style="margin-left:auto"><span class="eyebrow" style="display:block;margin-bottom:4px">Group by</span>' +
      '<span class="seg" role="group" aria-label="Group by">' +
      '<button type="button" data-grain="month" aria-pressed="' + (grain === "month") + '">Monthly</button>' +
      '<button type="button" data-grain="week" aria-pressed="' + (grain === "week") + '">Weekly</button>' +
      "</span></div></div>" +
      '<div class="panel-b">' +
      '<div class="legend">' +
      '<span><i style="background:var(--accent)"></i>Median &mdash; a typical ticket</span>' +
      '<span><i style="background:var(--series-2)"></i>Average &mdash; pulled up by the slowest tickets</span>' +
      '<span><i style="background:var(--neutral-mark);opacity:.6"></i>Tickets raised</span>' +
      (provCount ? '<span><i style="background:var(--bad);opacity:.25"></i>Still settling</span>' : "") +
      "</div>" +
      '<div class="trend">' + trendChart(pts) + '<div class="tip" id="trendTip"></div></div>' +
      (change == null ? "" :
        '<p class="caption">Between <b>' + esc(first.label) + "</b> and <b>" + esc(lastSettled.label) +
        "</b> a typical ticket moved from <b>" + dhm(first.median) + "</b> to <b>" + dhm(lastSettled.median) +
        "</b> &mdash; " + Math.abs(Math.round(change)) + "% " + dir + ". Over the same span the average " +
        "went from <b>" + dhm(first.mean) + "</b> to <b>" + dhm(lastSettled.mean) + "</b>.</p>") +
      (provCount
        ? '<p class="caption"><b>The shaded ' +
          (provCount === 1 ? "bucket on the right is" : provCount + " buckets on the right are") +
          " still settling.</b> " +
          (provCount === 1 ? "It still contains tickets" : "They still contain tickets") +
          " that have not been closed, and an open ticket can only be measured up to the cutoff of " +
          "20 Aug 2026, 9:30 AM. " +
          (provCount === 1 ? "Its true average" : "Their true averages") +
          " will settle higher than plotted, so read " +
          (provCount === 1 ? "that last point" : "the final stretch") +
          " as a floor rather than a result.</p>"
          : "") +
      "</div>" +
      fx("fx-trend-" + grain,
        "Add one more helper column for the time bucket, then average the <code>" + XL.mins +
        "</code> column within each bucket. " + (grain === "week"
          ? "The week key is the Monday that starts the week."
          : "The month key is the year and month the ticket was raised."),
        formula(grain === "week" ? "Week bucket — fill down" : "Month bucket — fill down",
          XL.bucket + XL.first, grain === "week" ? F.weekKey : F.monthKey) +
        formula("Median for one bucket (" + last.key + ") — the blue line", null, F.bucketMedian(last.key)) +
        formula("Average for that bucket — the orange line", null, F.bucketAvg(last.key)) +
        formula("Tickets raised in that bucket", null, F.bucketCount(last.key)) +
        formula("Still-open tickets in it (what makes a bucket provisional)", null, F.bucketOpen(last.key))) +
      "</div>";
  }

  /* ---- why the median leads, argued from this dataset ---- */
  function secWhyMedian() {
    var all = TICKETS.map(function (t) { return t.mins; });
    var mean = SOC.all.mean, median = SOC.all.median;
    var below = all.filter(function (m) { return m < mean; }).length;
    var pctBelow = Math.round((below / all.length) * 100);
    var ratio = (mean / median).toFixed(1);

    /* how differently the two measures rank the same villas */
    var byMean = FLATS.slice().sort(function (a, b) { return VILLA[a].all.mean - VILLA[b].all.mean; });
    var meanRank = {};
    byMean.forEach(function (f, i) { meanRank[f] = i + 1; });
    var moved = FLATS.map(function (f) {
      return { flat: f, move: Math.abs(meanRank[f] - VILLA[f].rank), byMean: meanRank[f], byMedian: VILLA[f].rank };
    }).sort(function (a, b) { return b.move - a.move; });
    var big = moved.filter(function (m) { return m.move > 20; }).length;
    var top = moved[0];

    /* the tail the median cannot see */
    var worst = TICKETS.slice().sort(function (a, b) { return b.mins - a.mins; })[0];

    return '<div class="panel" id="why-median"><div class="panel-h"><div>' +
      "<h2>Why the median leads, and where it misleads</h2>" +
      "<p>The choice of headline number changes who looks good, so it is worth stating plainly.</p>" +
      "</div></div><div class=\"panel-b\">" +

      '<div class="cards" style="margin-bottom:20px">' +
      '<div class="card"><div class="card-top">' +
      '<div class="card-tag"><span class="dot usual"></span><b>A typical ticket</b><code>median</code></div>' +
      '<div class="hero"><span class="v">' + days(median) + '</span><span class="u">days · ' + dhm(median) + "</span></div>" +
      '<div class="card-sub"><span>Half of all ' + all.length + " tickets closed faster than this</span></div>" +
      "</div></div>" +
      '<div class="card"><div class="card-top">' +
      '<div class="card-tag"><span class="dot urgent"></span><b>The arithmetic average</b><code>mean</code></div>' +
      '<div class="hero"><span class="v">' + days(mean) + '</span><span class="u">days · ' + dhm(mean) + "</span></div>" +
      '<div class="card-sub"><span><b>' + pctBelow + "%</b> of tickets were faster than this &mdash; " +
      "it describes almost nobody</span></div>" +
      "</div></div></div>" +

      '<div class="meth">' +
      "<section><h3>The average is " + ratio + "&times; the median</h3><p>Resolution times are not " +
      "symmetric. Most tickets close quickly and a small number run for weeks, and those few drag the " +
      "mean upward without describing anyone&rsquo;s actual experience. The slowest single ticket in " +
      "this export &mdash; " + esc(worst.flat) + ", " + esc(catLabel(worst.category)) + " &mdash; took <b>" +
      dhm(worst.mins) + "</b>. One ticket like that lifts a villa&rsquo;s average for the whole period.</p></section>" +

      "<section><h3>It changes the league table</h3><p>Ranking by mean instead of median moves <b>" + big +
      "</b> of the " + FLATS.length + " villas by more than twenty places. " + esc(top.flat) +
      " is the clearest case: <b>#" + top.byMean + "</b> by average, <b>#" + top.byMedian +
      "</b> by median. The average was largely ranking villas by whether they happened to get one " +
      "unlucky ticket, not by the service they usually receive.</p></section>" +

      "<section><h3>Where the median misleads</h3><p>The median hides the tail, and the tail is real. " +
      "A villa with nine quick tickets and one that dragged on for two months has a healthy median and " +
      "a genuine grievance. That is why every card here also shows the average and the slowest ticket, " +
      "and why the league table keeps a <b>Slowest ticket</b> column. Read the median for the routine " +
      "case and the slowest for the worst case &mdash; neither number alone is the whole story.</p></section>" +

      "<section><h3>What is not being done</h3><p>No outliers are removed, no ticket is weighted more " +
      "than another, and nothing is smoothed. The median and the mean are both computed over exactly " +
      "the same set of rows, so the gap between them is a property of the data rather than of the " +
      "method.</p></section>" +
      "</div></div>" +

      fx("fx-why-median",
        "Both measures over every ticket, so you can see the gap yourself. The median is an array " +
        "formula &mdash; Ctrl+Shift+Enter before Excel 365.",
        formula("Society median", null, F.socMedian) +
        formula("Society average", null, F.socAll) +
        formula("How many tickets beat the average", null,
          "=COUNTIF(" + MR + ',"<"&AVERAGE(' + MR + "))") +
        formula("The slowest single ticket", null, "=MAX(" + MR + ")")) +
      "</div>";
  }

  /* ---- every villa, sortable ---- */
  var COLS = [
    { k: "rank", t: "#", n: true },
    { k: "flat", t: "Villa", n: false },
    { k: "n", t: "Tickets", n: true },
    { k: "open", t: "Open", n: true },
    { k: "median", t: "Typical (median)", n: true },
    { k: "urgent", t: "Urgent median", n: true },
    { k: "usual", t: "Usual median", n: true },
    { k: "mean", t: "Average", n: true },
    { k: "max", t: "Slowest ticket", n: true }
  ];

  function rowVals(f) {
    var v = VILLA[f];
    return {
      rank: v.rank, flat: f, n: v.all.n, open: v.open,
      urgent: v["Level-1"].median, usual: v["NA"].median,
      mean: v.all.mean, median: v.all.median, max: v.all.max
    };
  }

  function secTable(f) {
    var q = S.q.trim().toLowerCase();
    var list = FLATS.map(rowVals).filter(function (r) {
      return !q || r.flat.toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) {
      var x = a[S.sortKey], y = b[S.sortKey];
      if (x == null) return 1;
      if (y == null) return -1;
      if (S.sortKey === "flat") return (num(x) - num(y)) * S.sortDir;
      return (x - y) * S.sortDir;
    });

    var head = COLS.map(function (c) {
      var on = S.sortKey === c.k;
      return '<th class="s' + (on ? " on" : "") + '" data-sort="' + c.k + '" scope="col">' + esc(c.t) +
        '<span class="ar">' + (on ? (S.sortDir > 0 ? "▲" : "▼") : "▲") + "</span></th>";
    }).join("");

    var body = list.map(function (r) {
      return '<tr class="' + (r.flat === f ? "me" : "") + '" data-goto="' + esc(r.flat) + '" style="cursor:pointer">' +
        '<td class="n">' + r.rank + "</td>" +
        '<td class="n">' + esc(r.flat) + "</td>" +
        '<td class="n">' + r.n + "</td>" +
        '<td class="n">' + (r.open || "—") + "</td>" +
        '<td class="n">' + dhm(r.median) + "</td>" +
        '<td class="n">' + dhm(r.urgent) + "</td>" +
        '<td class="n">' + dhm(r.usual) + "</td>" +
        '<td class="n">' + dhm(r.mean) + "</td>" +
        '<td class="n">' + dhm(r.max) + "</td></tr>";
    }).join("");

    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>Every villa, ranked</h2>" +
      "<p>Ranked by median. Sort by any column, or search for a neighbour; click a row to open that villa. " +
      "The <b>Slowest ticket</b> column is deliberately kept in view &mdash; a good median can still hide " +
      "one very bad ticket.</p></div></div>" +
      '<div class="panel-b">' +
      '<div class="tbl-tools"><input id="tblQ" type="search" placeholder="Search villa…" value="' + esc(S.q) + '">' +
      '<span class="tbl-note">' + list.length + " of " + FLATS.length + " villas · society median " +
      dhm(SOC.all.median) + " · fastest " + esc(FASTEST) + " (" + dhm(VILLA[FASTEST].all.median) +
      ") · slowest " + esc(SLOWEST) + " (" + dhm(VILLA[SLOWEST].all.median) + ")</span></div>" +
      '<div class="tbl-scroll"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      "</div>" +
      fx("fx-table",
        "Build the whole league table in three columns, then sort it. The median column is an " +
        "array formula &mdash; Ctrl+Shift+Enter before Excel 365, plain Enter in 365.",
        formula("List every villa once", XL.uniq + XL.first, F.uniqList) +
        formula("Median for that villa (fill down to row " + XL.uniqLast + ")", XL.avg + XL.first, F.perVillaMedian) +
        formula("Rank it", "AC" + XL.first, "=RANK($" + XL.avg + XL.first + "," + AVGR + ",1)") +
        formula("Average for that villa, for the last column", "AD" + XL.first, F.perVilla) +
        formula("Society median, all tickets", null, F.socMedian) +
        formula("Society average, all tickets", null, F.socAll)) +
      "</div>";
  }

  /* ---- ticket ledger ---- */
  function secLedger(f) {
    var v = VILLA[f];
    var body = v.tickets.map(function (t) {
      return "<tr><td class=\"n\">" + t.id + "</td>" +
        "<td>" + dt(t.created) + "</td>" +
        "<td>" + (t.open ? '<span class="pill open">Open</span>' : dt(t.closed)) + "</td>" +
        "<td>" + esc(catLabel(t.category)) + "</td>" +
        "<td>" + esc(t.subject) + "</td>" +
        '<td><span class="pill ' + (t.esc === "Level-1" ? "urgent" : "usual") + '">' + ESC[t.esc] + "</span></td>" +
        '<td class="n">' + dhm(t.mins) + "</td>" +
        '<td class="n">' + n0(t.mins) + "</td></tr>";
    }).join("");

    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>Every ticket from " + esc(f) + "</h2>" +
      "<p>The rows behind the averages above. <b>Minutes</b> is the value the helper column produces for that ticket &mdash; " +
      "check any one of them by hand.</p></div></div>" +
      '<div class="panel-b"><div class="tbl-scroll"><table><thead><tr>' +
      "<th>Id</th><th>Raised</th><th>Closed</th><th>Category</th><th>Subject</th>" +
      "<th>Escalation</th><th>Time taken</th><th>Minutes</th></tr></thead><tbody>" +
      body + "</tbody></table></div></div>" +
      fx("fx-ledger-" + f,
        "Every ticket for this villa, straight from the sheet — filter column <code>" + C.flat +
        "</code> to <code>" + esc(f) + "</code>. The Minutes column is:",
        formula("Minutes helper", XL.mins + XL.first, F.minutes) +
        formula("Readable form", null, F.display)) +
      "</div>";
  }

  /* ---- methodology ---- */
  function secMethod() {
    return '<div class="panel"><div class="panel-h"><div>' +
      "<h2>How every number on this page is built</h2>" +
      "<p>Open <code>" + esc(META.source) + "</code>, add the two cells below, and every figure here can be " +
      "reproduced with a standard Excel formula. Nothing is pre-computed anywhere else.</p></div></div>" +
      '<div class="panel-b">' +
      '<div class="meth">' +
      "<section><h3>1. The sheet as exported</h3><p>Row 1 is the report title and row 2 is blank. " +
      "Column headers sit on <b>row 3</b>, and the " + META.total + " tickets occupy <b>rows " +
      XL.first + " to " + XL.last + "</b>. Villa is column <code>" + C.flat + "</code>, escalation level is <code>" +
      C.esc + "</code>, resolution time is <code>" + C.rtat + "</code>.</p></section>" +

      "<section><h3>2. Turning the time text into a number</h3><p><code>" + C.rtat + "</code> holds text such as " +
      "<code>2 day(s): 3 hour(s): 5 minute(s)</code>, which Excel cannot average. The helper column converts it " +
      "to plain minutes.</p></section>" +

      "<section><h3>3. Tickets that are still open</h3><p>" + META.openCount + " tickets have never been closed " +
      "(<code>" + C.closed + "</code> is <code>-</code>). Their exported resolution time is stale, so they are " +
      "measured from when they were raised up to a fixed cutoff of <b>20 August 2026, 9:30 AM</b>. " +
      "They are included in every average on this page.</p></section>" +

      "<section><h3>4. Escalation levels</h3><p>The export uses two values. <code>Level-1</code> is shown here as " +
      "<b>Urgent</b> and <code>NA</code> as <b>Usual</b>. No other value appears in the data.</p></section>" +

      "<section><h3>5. Columns that were dropped</h3><p>These held one identical value on all " + META.total +
      " rows, so they carry no information and are not shown.</p>" +
      '<ul class="drop">' + META.droppedColumns.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") +
      "</ul></section>" +

      "<section><h3>6. Median first, average alongside</h3><p>The headline figure everywhere on this page " +
      "is the <b>median</b>, because the average runs " + (SOC.all.mean / SOC.all.median).toFixed(1) +
      "&times; higher and describes almost no real ticket. The average is still shown next to it, and " +
      "rankings use the median. Neither is weighted and no outlier is removed &mdash; see " +
      '<a href="#why-median" style="color:var(--accent-ink)">Why the median leads</a>. ' +
      "Excel has no <code>MEDIANIFS</code>, so every median here is <code>MEDIAN(IF(...))</code>, entered " +
      "as an array formula.</p></section>" +
      "</div></div>" +
      fx("fx-method",
        "Add these two cells to the sheet, then fill <code>" + XL.mins + XL.first + "</code> down to row " +
        XL.last + ". Every other formula on this page depends only on these.",
        formula("Cutoff for open tickets", "Z1", F.cutoff) +
        formula("Minutes — fill down " + XL.mins + XL.first + ":" + XL.mins + XL.last, XL.mins + XL.first, F.minutes) +
        formula("Excel 365 alternative (same result, shorter)", XL.mins + XL.first,
          '=IF($' + C.closed + N1 + '="-",\n' +
          '  ROUND(($' + XL.cutoff + '-(DATE(2000+VALUE(MID($' + C.created + N1 + ',7,2)),VALUE(MID($' +
          C.created + N1 + ',4,2)),VALUE(LEFT($' + C.created + N1 + ',2)))+TIMEVALUE(MID($' +
          C.created + N1 + ',11,8))))*1440,0),\n' +
          '  VALUE(TEXTBEFORE($' + C.rtat + N1 + '," "))*1440\n' +
          '   +VALUE(TEXTBEFORE(TEXTAFTER($' + C.rtat + N1 + ',": ")," "))*60\n' +
          '   +VALUE(TEXTBEFORE(TEXTAFTER($' + C.rtat + N1 + ',": ",2)," ")))')) +
      "</div>";
  }

  function blank() {
    return '<div class="panel"><div class="blank"><b>Search for your villa to begin</b>' +
      "Type a villa number above &mdash; for example <b>75</b> or <b>Villa-75</b>.<br>" +
      "This report covers " + META.total + " tickets from " + FLATS.length + " villas, raised between " +
      dt(META.rangeStart) + " and " + dt(META.rangeEnd) + ".</div></div>" +
      secTrend() + secWhyMedian() + secTable(null) + secMethod();
  }

  /* ==================== render ==================== */
  var app = document.getElementById("app");
  var footEl = document.getElementById("foot");

  function render() {
    var f = S.flat;
    app.innerHTML = f
      ? secIdentity(f) + secEscalation(f) + secStanding(f) + secHeadToHead(f) +
        secCategories(f) + secTrend() + secWhyMedian() + secTable(f) + secLedger(f) + secMethod()
      : blank();

    footEl.innerHTML = esc(META.society) + " help desk export &mdash; " + META.total + " tickets, " +
      FLATS.length + " villas, " + dt(META.rangeStart) + " to " + dt(META.rangeEnd) + ". " +
      "Open tickets are measured to a fixed cutoff of 20 Aug 2026, 9:30 AM. " +
      "Source file: " + esc(META.source) + ". Built " + dt(META.generated) + ".";
  }

  /* ==================== interactions ==================== */
  var input = document.getElementById("villaInput");
  var sugg = document.getElementById("sugg");
  var cur = -1, matches = [];

  function match(q) {
    q = q.trim().toLowerCase().replace(/^villa[-\s]*/, "");
    if (!q) return FLATS.slice(0, 30);
    return FLATS.filter(function (f) {
      return f.toLowerCase().indexOf(q) >= 0 || String(num(f)).indexOf(q) === 0;
    }).slice(0, 40);
  }

  function drawSugg() {
    if (!matches.length) {
      sugg.innerHTML = '<div class="none">No villa matches that.</div>';
    } else {
      sugg.innerHTML = matches.map(function (f, i) {
        var v = VILLA[f];
        return '<button type="button" role="option" aria-selected="' + (i === cur) + '" class="' +
          (i === cur ? "cur" : "") + '" data-pick="' + esc(f) + '">' +
          '<span class="sv">' + esc(f) + "</span>" +
          '<span class="sm">' + v.all.n + " tickets · " + dhm(v.all.mean) + " avg</span></button>";
      }).join("");
    }
    sugg.classList.add("on");
    input.setAttribute("aria-expanded", "true");
  }
  function closeSugg() {
    sugg.classList.remove("on");
    input.setAttribute("aria-expanded", "false");
    cur = -1;
  }
  function pick(f) {
    S.flat = f;
    S.peer = null;
    input.value = f;
    closeSugg();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (history.replaceState) history.replaceState(null, "", "#" + encodeURIComponent(f));
  }

  input.addEventListener("input", function () { matches = match(input.value); cur = -1; drawSugg(); });
  input.addEventListener("focus", function () { matches = match(input.value); drawSugg(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!sugg.classList.contains("on")) { matches = match(input.value); drawSugg(); return; }
      cur += e.key === "ArrowDown" ? 1 : -1;
      if (cur < 0) cur = matches.length - 1;
      if (cur >= matches.length) cur = 0;
      drawSugg();
      var el = sugg.children[cur];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (matches.length) pick(matches[cur >= 0 ? cur : 0]);
    } else if (e.key === "Escape") { closeSugg(); }
  });
  sugg.addEventListener("mousedown", function (e) {
    var b = e.target.closest("[data-pick]");
    if (b) { e.preventDefault(); pick(b.getAttribute("data-pick")); }
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".lookup")) closeSugg();
  });

  /* delegated: formula drawers, copy, sorting, row clicks, peer select */
  document.addEventListener("click", function (e) {
    var fxb = e.target.closest("[data-fx]");
    if (fxb) {
      var id = fxb.getAttribute("data-fx");
      var body = document.getElementById(id);
      var on = !body.classList.contains("on");
      body.classList.toggle("on", on);
      fxb.setAttribute("aria-expanded", String(on));
      if (on) OPEN_FX[id] = true; else delete OPEN_FX[id];
      return;
    }
    var cp = e.target.closest("[data-copy]");
    if (cp) {
      var txt = cp.getAttribute("data-copy");
      var done = function () {
        cp.textContent = "Copied";
        cp.classList.add("done");
        setTimeout(function () { cp.textContent = "Copy"; cp.classList.remove("done"); }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
      } else { fallbackCopy(txt, done); }
      return;
    }
    var th = e.target.closest("[data-sort]");
    if (th) {
      var k = th.getAttribute("data-sort");
      if (S.sortKey === k) S.sortDir *= -1; else { S.sortKey = k; S.sortDir = 1; }
      render();
      return;
    }
    var gr = e.target.closest("[data-grain]");
    if (gr) { S.grain = gr.getAttribute("data-grain"); TREND_PTS = null; render(); return; }
    var tr = e.target.closest("[data-goto]");
    if (tr) { pick(tr.getAttribute("data-goto")); }
  });

  /* trend tooltip */
  var TREND_PTS = null;
  document.addEventListener("mouseover", function (e) {
    var band = e.target.closest("[data-band]");
    var tip = document.getElementById("trendTip");
    if (!band || !tip) return;
    var pts = TREND_PTS || (TREND_PTS = trendSeries(S.grain));
    var p = pts[+band.getAttribute("data-band")];
    if (!p) return;
    tip.innerHTML = "<b>" + esc(p.label) + "</b>" +
      '<div class="r"><i style="background:var(--accent)"></i>Average<span>' + dhm(p.mean) + "</span></div>" +
      '<div class="r"><i style="background:var(--series-2)"></i>Median<span>' + dhm(p.median) + "</span></div>" +
      '<div class="r"><i style="background:var(--neutral-mark);opacity:.6"></i>Tickets<span>' + p.n + "</span></div>" +
      (p.open ? '<div class="prov">' + p.open + " of these " + (p.open === 1 ? "is" : "are") +
        " still open, so this point is a floor, not a final figure.</div>" : "");
    var wrap = band.closest(".trend"), wr = wrap.getBoundingClientRect(), br = band.getBoundingClientRect();
    tip.classList.add("on");
    var tw = tip.offsetWidth;
    var left = br.left - wr.left + br.width / 2 - tw / 2;
    tip.style.left = Math.max(0, Math.min(left, wr.width - tw)) + "px";
    tip.style.top = (br.top - wr.top + 8) + "px";
  });
  document.addEventListener("mouseout", function (e) {
    if (!e.target.closest("[data-band]")) return;
    var tip = document.getElementById("trendTip");
    if (tip) tip.classList.remove("on");
  });

  function fallbackCopy(txt, done) {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (err) { /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  document.addEventListener("change", function (e) {
    if (e.target.id === "peerSel") { S.peer = e.target.value; render(); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "tblQ") {
      S.q = e.target.value;
      render();
      var el = document.getElementById("tblQ");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  });

  /* ==================== boot ==================== */
  document.getElementById("socName").textContent = META.society;
  var hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (hash && VILLA[hash]) { S.flat = hash; input.value = hash; }
  render();
})();

</script>
